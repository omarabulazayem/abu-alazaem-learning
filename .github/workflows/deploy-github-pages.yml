name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "netlify-app/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        working-directory: netlify-app
        run: npm install --no-audit --no-fund

      - name: Build app for GitHub Pages
        working-directory: netlify-app
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: "https://ksadinnwokbxpwmfzzqx.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_gFnnXmpPCVNOtrnz5-zUwQ_WOc46f8d"
        run: npm run build

      - name: Add SPA fallback
        run: |
          cp netlify-app/dist/index.html netlify-app/dist/404.html
          touch netlify-app/dist/.nojekyll

      - name: Mirror production build to main root
        run: |
          rm -rf assets
          cp netlify-app/dist/index.html ./index.html
          cp netlify-app/dist/404.html ./404.html
          cp -R netlify-app/dist/assets ./assets
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish GitHub Pages build [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: netlify-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
