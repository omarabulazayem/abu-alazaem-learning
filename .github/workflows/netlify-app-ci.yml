name: Netlify App CI

on:
  push:
    branches: [main]
    paths:
      - "netlify-app/**"
      - "netlify.toml"
      - ".github/workflows/netlify-app-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "netlify-app/**"
      - "netlify.toml"
      - ".github/workflows/netlify-app-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netlify-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
